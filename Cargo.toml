[package]
name = "vpn-rs"
version = "0.0.17-alpha1"
edition = "2021"
description = "IP-over-QUIC VPN tunnel via iroh P2P"
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
dirs = "6"
env_logger = "0.11"
etherparse = "0.18"
fs2 = "0.4"
futures = "0.3"
ipnet = { version = "2", features = ["serde"] }
iroh = "1.0.0-rc.1"
iroh-mdns-address-lookup = "0.3.0"
# Direct dependency only to enable the fast-apple-datapath feature on the
# patched netwatch below (iroh pulls netwatch in but doesn't expose it).
netwatch = { version = "0.18", features = ["fast-apple-datapath"] }
noq-proto = "1.0.0-rc.1"
log = "0.4"
libc = "0.2"
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tun = { version = "0.8", features = ["async"] }
url = "2"

# netwatch 0.18.0 + a patch that activates noq-udp's Apple fast UDP datapath
# (batched sendmsg_x/recvmsg_x syscalls on macOS). Drop once upstream ships it.
[patch.crates-io]
netwatch = { git = "https://github.com/andrewchen5678/net-tools", branch = "apple-fast-datapath" }

[dev-dependencies]
mock_instant = "0.5"
rand_chacha = "0.9"
tempfile = "3.24.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
