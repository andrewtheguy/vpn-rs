[package]
name = "vpn-rs"
version = "0.0.23-alpha1"
edition = "2024"
description = "Single-purpose IP-over-UDP VPN tunnel (loopback-only; an external tunnel provides the encrypted transport)"
readme = "README.md"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
dirs = "6"
env_logger = "0.11"
etherparse = "0.18"
fs2 = "0.4"
futures = "0.3"
ipnet = { version = "2", features = ["serde"] }
log = "0.4"
libc = "0.2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tun = { version = "0.8", features = ["async"] }

[dev-dependencies]
mock_instant = "0.5"
rand_chacha = "0.9"
tempfile = "3.24.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
